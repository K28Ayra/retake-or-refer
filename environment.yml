name: retina
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1
      - torchvision==0.19.1
      - timm==1.0.26
      - numpy<2
      - pandas
      - scipy
      - scikit-learn
      - opencv-python-headless
      - pillow
      - pyyaml
      - matplotlib
      - tqdm
      - openpyxl
      - onnx==1.17.0
      - onnxruntime==1.19.2
      - requests
      - pytest
      - -e .
